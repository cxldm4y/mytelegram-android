name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          mkdir -p TMessagesProj/config
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/config/release.keystore

      - name: Build APK
        run: >
          ./gradlew :TMessagesProj_App:assembleRelease
          -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}"
          -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"
          -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/*.apk'
